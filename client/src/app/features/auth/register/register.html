<div class="auth-card">
  <h1>Criar conta</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nome
      <input type="text" formControlName="nome" autocomplete="name" />
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    <label>
      Morada
      <input type="text" formControlName="morada" autocomplete="street-address" />
    </label>

    <label>
      Telefone
      <input type="tel" formControlName="telefone" autocomplete="tel" />
    </label>

    <label>
      Tipo de conta
      <select formControlName="role">
        <option value="cliente">Cliente</option>
        <option value="estafeta">Estafeta (requer aprovação)</option>
      </select>
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'A criar…' : 'Criar conta' }}
    </button>
  </form>

  <p class="muted">Já tens conta? <a routerLink="/login">Entra aqui</a>.</p>
</div>

<div class="auth-wrapper">
  <div class="card shadow-sm border-0" style="max-width: 520px; width: 100%">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Criar conta</h1>
      <p class="text-muted small mb-4">Junta-te à ElSircários Tech Store.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="nome">Nome</label>
            <input
              id="nome"
              type="text"
              class="form-control"
              formControlName="nome"
              autocomplete="name"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input
              id="email"
              type="email"
              class="form-control"
              formControlName="email"
              autocomplete="email"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="password">Password</label>
            <input
              id="password"
              type="password"
              class="form-control"
              formControlName="password"
              autocomplete="new-password"
            />
          </div>

          <div class="col-12">
            <label class="form-label" for="morada">Morada</label>
            <app-address-input id="morada" formControlName="morada" />
            <div class="form-text">Começa a escrever e escolhe a tua morada nas sugestões.</div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="telefone">Telefone</label>
            <input
              id="telefone"
              type="tel"
              class="form-control"
              formControlName="telefone"
              autocomplete="tel"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="role">Tipo de conta</label>
            <select id="role" class="form-select" formControlName="role">
              <option value="cliente">Cliente</option>
              <option value="estafeta">Estafeta (requer aprovação)</option>
            </select>
          </div>
        </div>

        @if (error()) {
          <div class="alert alert-danger py-2 small mt-3">{{ error() }}</div>
        }

        <button
          type="submit"
          class="btn btn-brand w-100 mt-4"
          [disabled]="form.invalid || loading()"
        >
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-1"></span> A criar…
          } @else {
            Criar conta
          }
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Já tens conta? <a routerLink="/login">Entra aqui</a>.
      </p>
    </div>
  </div>
</div>

<div class="auth-wrapper">
  <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Entrar</h1>
      <p class="text-muted small mb-4">Acede à tua conta paw-techstore.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            autocomplete="email"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
          />
        </div>

        @if (error()) {
          <div class="alert alert-danger py-2 small">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-brand w-100" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-1"></span> A entrar…
          } @else {
            Entrar
          }
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Não tens conta? <a routerLink="/registo">Cria uma aqui</a>.
      </p>
    </div>
  </div>
</div>

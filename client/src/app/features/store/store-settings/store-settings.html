<div class="container py-4" style="max-width: 680px">
  <h1 class="h4 mb-3">Configuração da loja</h1>

  @if (loading()) {
    <div class="text-center py-5"><span class="spinner-border text-secondary"></span></div>
  } @else {
    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label" for="nome">Nome da loja</label>
          <input id="nome" class="form-control" [(ngModel)]="model.nome" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="horario">Horário de funcionamento</label>
          <input id="horario" class="form-control" [(ngModel)]="model.horario" />
        </div>
        <div class="mb-1">
          <label class="form-label" for="logo">Logótipo</label>
          @if (model.logotipo) {
            <div class="mb-2">
              <img [src]="img(model.logotipo)" alt="logótipo" style="height: 48px" />
            </div>
          }
          <input
            id="logo"
            type="file"
            accept="image/*"
            class="form-control"
            (change)="onLogo($event)"
          />
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body">
        <h2 class="h6 mb-3">Métodos de entrega</h2>
        @for (m of model.metodosEntrega; track trackMetodo($index, m)) {
          <div class="row g-2 align-items-center mb-2">
            <div class="col-6">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [id]="m.metodo"
                  [(ngModel)]="m.ativo"
                />
                <label class="form-check-label" [for]="m.metodo">{{ labels[m.metodo] }}</label>
              </div>
            </div>
            <div class="col-6">
              <div class="input-group input-group-sm">
                <span class="input-group-text">Custo €</span>
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  class="form-control"
                  [(ngModel)]="m.custo"
                />
              </div>
            </div>
          </div>
        }
      </div>
    </div>

    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-brand" [disabled]="saving()" (click)="save()">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        Guardar
      </button>
      @if (saved()) {
        <span class="text-success small"><i class="bi bi-check-circle"></i> Guardado</span>
      }
    </div>
  }
</div>

<header class="navbar">
  <a routerLink="/" class="brand">paw-techstore</a>

  <nav>
    @if (auth.isAuthenticated()) {
      <span class="user">{{ auth.user()?.nome }} ({{ auth.role() }})</span>
      @if (auth.hasRole('admin')) {
        <a routerLink="/admin/estafetas">Estafetas</a>
      }
      <button type="button" (click)="logout()">Sair</button>
    } @else {
      <a routerLink="/login">Entrar</a>
      <a routerLink="/registo">Registar</a>
    }
  </nav>
</header>

<main class="content">
  <router-outlet />
</main>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy das chamadas à API e uploads para o container da API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /uploads/ {
        proxy_pass http://api:3000;
    }

    # SPA fallback — Angular trata do routing client-side
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    # Porta não-privilegiada (>1024): permite ao nginx correr como uid 101.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy das chamadas à API e uploads para o container da API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /uploads/ {
        proxy_pass http://api:3000;
    }

    # Socket.IO (tempo real) — requer upgrade para WebSocket
    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback — Angular trata do routing client-side
    location / {
        try_files $uri $uri/ /index.html;

        # ── Cabeçalhos de segurança (app servida pelo nginx) ──
        # CSP afinado ao que a app usa: scripts próprios (sem eval/inline),
        # estilos inline do Angular + Google Fonts, mapas OSM/Nominatim,
        # imagens próprias/https e ligações à API + websocket (Socket.IO).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://nominatim.openstreetmap.org; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    }
}

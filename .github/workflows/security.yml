name: Security (DevSecOps)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permite correr manualmente

permissions:
  contents: read
  security-events: write # para upload de SARIF (GitHub Security tab)

jobs:
  # ── 1. Secrets scanning: Gitleaks + TruffleHog ──
  secrets:
    name: Secrets (Gitleaks + TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # histórico completo para varrer commits antigos

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --results=verified,unknown

  # ── 2. SAST: Semgrep ──
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif
        continue-on-error: true
      - name: Upload SARIF para GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif

  # ── 3. SCA: Trivy + OWASP Dependency-Check ──
  sca:
    name: SCA (Trivy + Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: paw-techstore
          path: .
          format: JSON
          args: >-
            --enableExperimental

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: |
            trivy.json
            reports/

  # ── 4. SBOM: Syft (CycloneDX) ──
  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Gerar SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.cyclonedx.json

  # ── 5. DAST: OWASP ZAP baseline contra a API a correr ──
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Subir a stack (mongo + api + client)
        run: docker compose up -d --build
      - name: Aguardar a API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then echo "API pronta"; break; fi
            sleep 3
          done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:3000"
          cmd_options: "-a"
          fail_action: false
      - name: Parar a stack
        if: always()
        run: docker compose down -v

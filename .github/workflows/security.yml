name: Security (DevSecOps)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permite correr manualmente

permissions:
  contents: read
  security-events: write # para upload de SARIF (GitHub Security tab)
  actions: read # Semgrep lê o workflow-run (telemetria/status report)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Secrets scanning: Gitleaks + TruffleHog ──
  secrets:
    name: Secrets (Gitleaks + TruffleHog)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # token read-only nos PRs do bot
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo para varrer commits antigos

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --results=verified,unknown

  # ── 2. SAST: Semgrep ──
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif
        continue-on-error: true
      # NOTA: o upload para o separador Security (codeql-action/upload-sarif)
      # exige "Code scanning" ativado (repo público ou GitHub Advanced Security).
      # Como o repo não o tem, ficamos só pelo artefacto descarregável.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif

  # ── 3. SCA: Trivy + OWASP Dependency-Check ──
  sca:
    name: SCA (Trivy + Dependency-Check)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: paw-techstore
          path: .
          format: JSON
          args: >-
            --enableExperimental

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sca-reports
          path: |
            trivy.json
            reports/

  # ── 4. SBOM: Syft (CycloneDX) ──
  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - name: Gerar SBOM
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: sbom.cyclonedx.json

  # ── 5. DAST: OWASP ZAP baseline contra a API a correr ──
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - name: Subir a stack (mongo + api + client)
        continue-on-error: true
        run: docker compose up -d --build
      - name: Aguardar a API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then echo "API pronta"; break; fi
            sleep 3
          done
      # ZAP via Docker direto (a action zaproxy/action-baseline@v0.12.0 usa a
      # API de artefactos antiga, já desligada pelo GitHub, e tenta criar
      # issues). Aqui controlamos o scan e o upload do relatório nós próprios.
      - name: ZAP baseline scan
        continue-on-error: true
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host \
            -v "${{ github.workspace }}/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -a \
            -J zap_report.json -r zap_report.html || true
      - name: Upload relatório ZAP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap-out/
          if-no-files-found: warn
      - name: Parar a stack
        if: always()
        run: docker compose down -v

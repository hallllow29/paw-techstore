version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, api]
    groups:
      api-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, client]
    # Majors do Angular exigem `ng update` (migração) — não um bump automático
    ignore:
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
    groups:
      client-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      ci-actions:
        patterns: ["*"]

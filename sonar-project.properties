sonar.projectKey=paw-techstore
sonar.projectName=paw-techstore
sonar.projectVersion=0.1.0

# Código-fonte (API + cliente)
sonar.sources=api/src,client/src
sonar.tests=api/tests
sonar.test.inclusions=**/*.test.js,**/*.spec.ts

# Exclusões
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,api/src/seed/**

# Cobertura de testes (gerada por `npm run test:coverage`)
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info,client/coverage/client/lcov.info

sonar.sourceEncoding=UTF-8
